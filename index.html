<style>
/* Layout: faixa de cabeçalho escura com abas; abaixo, área de trabalho clara em largura cheia, tabelas densas */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e9ece7; --line:#d5dbd3; --fg:#18211b; --muted:#5d685f;
  --band:#0f321e; --band-fg:#e8efe6; --band-muted:#9fb3a3; --accent:#2f7a45; --accent-fg:#ffffff;
  --st-livre:#2f7a45; --st-analise:#b7791f; --st-aprovada:#2b6cb0; --st-antecipada:#3c3f8f; --st-cobranca:#8a3f8c; --st-bloqueada:#c0392b; --st-reservada:#1f8a87; --st-recompra:#c2571a; --st-quitada:#7d867f;
  --warn-bg:#fdf3e1; --warn-fg:#8a5a10; --bad-bg:#fbe7e4; --bad-fg:#a1281c;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#161e18; --sunk:#1d2720; --line:#2c372f; --fg:#e4ebe5; --muted:#97a59a;
  --band:#0b100c; --band-fg:#e4ebe5; --band-muted:#86998a; --accent:#5cb874; --accent-fg:#0b120d;
  --st-livre:#5cb874; --st-analise:#e0a542; --st-aprovada:#6aa6e8; --st-antecipada:#9599ec; --st-cobranca:#c983cb; --st-bloqueada:#ef6f61; --st-reservada:#4fc6c1; --st-recompra:#f08a4b; --st-quitada:#7f8a82;
  --warn-bg:#3a2c12; --warn-fg:#f0c77a; --bad-bg:#3d1a16; --bad-fg:#f4a197; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#161e18; --sunk:#1d2720; --line:#2c372f; --fg:#e4ebe5; --muted:#97a59a;
  --band:#0b100c; --band-fg:#e4ebe5; --band-muted:#86998a; --accent:#5cb874; --accent-fg:#0b120d;
  --st-livre:#5cb874; --st-analise:#e0a542; --st-aprovada:#6aa6e8; --st-antecipada:#9599ec; --st-cobranca:#c983cb; --st-bloqueada:#ef6f61; --st-reservada:#4fc6c1; --st-recompra:#f08a4b; --st-quitada:#7f8a82;
  --warn-bg:#3a2c12; --warn-fg:#f0c77a; --bad-bg:#3d1a16; --bad-fg:#f4a197; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
header{background:var(--band);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:16px 0}
h1{font-family:var(--f-disp);font-weight:600;font-size:22px;margin:0;letter-spacing:.01em}
.basechip{font-size:12px;color:var(--band-muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.basechip b{color:var(--band-fg);font-weight:500;font-family:var(--f-num)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px}
nav button{background:none;border:0;color:var(--band-muted);font:500 14px var(--f-body);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--band-fg);border-bottom-color:var(--accent)}
nav button:hover{color:var(--band-fg)}
.scope{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:12px;border-bottom:1px solid var(--line);background:var(--surface)}
.scope label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
main{padding-block:20px 120px}
input,select,button,textarea{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad-fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h2{font-family:var(--f-disp);font-weight:600;font-size:17px;margin:0 0 10px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--k,transparent);cursor:default}
.kpi[data-go],.kpi[data-pendk]{cursor:pointer}.kpi[data-go]:hover,.kpi[data-pendk]:hover{background:var(--sunk)}
.kpi .v{font-family:var(--f-num);font-size:18px;white-space:nowrap;font-weight:500;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk);margin:6px 0 10px}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
th[data-sort]{cursor:pointer}th[data-sort]:hover{color:var(--fg)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--sunk)}
tr.sel td{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
td.r,th.r{text-align:right}
.nome{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn-fg);white-space:nowrap;font-weight:500}
.tag.bad{background:var(--bad-bg);color:var(--bad-fg)}
.tag.ok{background:color-mix(in srgb,var(--st-livre) 14%,transparent);color:var(--st-livre)}
.bar{height:8px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex;min-width:60px}
.bar span{height:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface));font-weight:600}
.chip .n{font-family:var(--f-num);color:var(--muted)}
.bulk{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--band);color:var(--band-fg);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(0,0,0,.15)}
.bulk .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px}
.bulk select,.bulk input{background:var(--surface);color:var(--fg)}
.bulk .btn{background:transparent;color:var(--band-fg);border-color:var(--band-muted)}
.bulk .btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:20;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;box-shadow:-10px 0 30px rgba(0,0,0,.18)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:19}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:12px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:30;font-size:13px}
.months{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.months .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.months .m span.b{width:100%;max-width:42px;background:var(--st-livre);border-radius:3px 3px 0 0;min-height:1px}
.months .m small{font-size:11px;color:var(--muted)}
.months .m em{font-style:normal;font-size:10px;color:var(--muted);font-family:var(--f-num)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:28px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--accent)}
ol.steps{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--muted)}
.list{display:grid;gap:0}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.list .it:last-child{border-bottom:0}
@media (prefers-reduced-motion:no-preference){.drawer{animation:sl .18s ease-out}@keyframes sl{from{transform:translateX(30px);opacity:.6}}}
</style>
<style>
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--band,#18301f);padding:16px}
#login[hidden]{display:none}
#login form{background:var(--surface,#fff);color:var(--fg,#18211b);border-radius:10px;padding:28px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#login h2{margin:0 0 4px;font-size:20px}
#login label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted,#5d685f)}
#login input{font:inherit;padding:9px 10px;border:1px solid var(--line,#d5dbd3);border-radius:6px;background:var(--surface,#fff);color:var(--fg,#18211b)}
#login button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:6px;background:var(--band,#18301f);color:#fff;cursor:pointer}
#login .msg{font-size:13px;color:#c0392b;min-height:1em}
.userbox{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.85}
.userbox button{font:inherit;font-size:12px;background:transparent;color:inherit;border:1px solid currentColor;border-radius:5px;padding:3px 8px;cursor:pointer}
</style>

<style>
/* ---------- versão celular: tabelas viram cartões ---------- */
@media (max-width:700px){
  .hrow{align-items:flex-start}
  h1{font-size:19px}
  .userbox{width:100%;justify-content:space-between}
  .scope .wrap{flex-wrap:wrap;gap:8px}
  .scope label{flex:1 1 140px}
  .scope input,.scope select{width:100%}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .kpi .v{font-size:22px}
  .toolbar > *{flex:1 1 100%}
  .tbl-wrap.cards{overflow:visible;border:0;background:transparent}
  .tbl-wrap.cards table,.tbl-wrap.cards tbody,.tbl-wrap.cards tr,.tbl-wrap.cards td{display:block;width:100%}
  .tbl-wrap.cards thead{display:none}
  .tbl-wrap.cards tr{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:6px 10px;position:relative}
  .tbl-wrap.cards td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:0;padding:4px 0;text-align:right;white-space:normal}
  .tbl-wrap.cards td::before{content:attr(data-label);color:var(--muted);font-size:11px;text-align:left;flex:0 0 38%;padding-top:2px}
  .tbl-wrap.cards td[data-label=""]::before{display:none}
  .tbl-wrap.cards td[data-label=""]{justify-content:flex-start}
  .tbl-wrap.cards td::before{font-family:"IBM Plex Sans",system-ui,sans-serif;letter-spacing:0}
  .tbl-wrap.cards td{padding:2px 0}
  .tbl-wrap.cards td:first-child:has(input[type=checkbox]){position:absolute;top:8px;left:10px;width:auto;padding:0}
  .tbl-wrap.cards tr:has(td:first-child input[type=checkbox]){padding-top:34px}
  .tbl-wrap.cards tbody tr:hover td{background:transparent}
  .tbl-wrap.cards td .nome{white-space:normal;max-width:none}
  .tbl-wrap.cards tfoot{display:block}
  .tbl-wrap.cards tfoot tr{background:var(--sunk)}
  .bulk .wrap{flex-wrap:wrap}
  .drawer{width:100%}
}
</style>

<style>

      <button role="tab" data-tab="importar" aria-selected="false">Atualizar base</button>

</header>
<div class="scope"><div class="wrap row" style="width:100%">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
/* Login: só libera o site depois que a pessoa entra */
window.AUTH_READY=new Promise(async resolve=>{
  const L=document.getElementById("login"),F=document.getElementById("loginf"),M=document.getElementById("lg-m");
  const ok=s=>{L.hidden=true;const ub=document.getElementById("userbox");ub.hidden=false;document.getElementById("useremail").textContent=s.user.email||"";resolve(s.user)};
  const {data}=await SB.auth.getSession();
  if(data&&data.session)return ok(data.session);
  L.hidden=false;setTimeout(()=>document.getElementById("lg-e").focus(),50);
  F.addEventListener("submit",async e=>{e.preventDefault();M.textContent="";const b=document.getElementById("lg-b");b.disabled=true;b.textContent="Entrando…";
    const {data,error}=await SB.auth.signInWithPassword({email:document.getElementById("lg-e").value.trim(),password:document.getElementById("lg-p").value});
    b.disabled=false;b.textContent="Entrar";
    if(error){M.textContent="E-mail ou senha incorretos.";return}
    ok(data.session)});
});
document.getElementById("logout").addEventListener("click",async()=>{await SB.auth.signOut();location.reload()});
</script>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=v=>BRL.format(v||0);
const short=v=>money(v);
const dBR=s=>s?s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4):"";
const digits=s=>String(s||"").replace(/\D/g,"");
const fmtDoc=s=>{const d=digits(s);if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4");if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,"$1.$2.$3/$4-$5");return s||""};
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

const ST={
  livre:{l:"Disponível",c:"var(--st-livre)"},
  analise:{l:"Em análise",c:"var(--st-analise)"},
  aprovada:{l:"Aprovada",c:"var(--st-aprovada)"},
  antecipada:{l:"Antecipada",c:"var(--st-antecipada)"},
  cobranca:{l:"Cobrança simples",c:"var(--st-cobranca)"},
  bloqueada:{l:"Bloqueada",c:"var(--st-bloqueada)"},
  reservada:{l:"Reservada p/ substituição",c:"var(--st-reservada)"},
  recompra:{l:"Recompra pendente",c:"var(--st-recompra)"},
  quitada:{l:"Quitada",c:"var(--st-quitada)"}

      <td>${r.situacao==="feita"?`<span class="tag ok">recompra feita ${dBR(r.feitaEm)}</span>`:`<span class="pill" style="--c:${ST.recompra.c}">Pendente</span>`}</td>

/* ---------- notas ---------- */
const PEND={ocultas:"Fora do site (não vieram no Protheus)",fora:"Na planilha, fora da consulta do Protheus",dy:"Descontadas do ano",fat:"Faturado (consulta Protheus)",rec:"Recompras pendentes",desc:"Todas as descontadas",quit:"Quitadas",arq:"Sem PDF e XML",na:"Livres de clientes não autorizados",blq:"Com fundo, mas bloqueadas",an:"Aguardando aprovação"};
function notaRows(){
  let rows=scoped().concat(S.base.filter(prevCed).map(n=>{const k=status(n);return {n,k,a:amount(n,k)}}));
  const q=S.q.trim().toUpperCase();
  if(q){const qd=digits(q);rows=rows.filter(r=>r.n.nome.toUpperCase().includes(q)||r.n.num.includes(q)||(qd.length>=3&&digits(r.n.cpf).includes(qd))||((mk(r.n.id)||{}).cessao||"").toUpperCase().includes(q))}
  if(S.fundoF)rows=rows.filter(r=>(mk(r.n.id)||{}).fundo===S.fundoF);
  if(S.pessoa)rows=rows.filter(r=>pessoa(r.n)===S.pessoa);
  if(S.cesF)rows=rows.filter(r=>{const m=mk(r.n.id);return m&&(m.fundo+"|"+(m.cessao||""))===S.cesF});
  if(S.arqF){const f={falta:a=>a!=="PX",pdf:a=>!a.includes("P"),xml:a=>!a.includes("X"),ok:a=>a==="PX"}[S.arqF];rows=rows.filter(r=>f(arq(r.n)))}
  if(S.pend==="arq")rows=rows.filter(r=>(r.k==="antecipada"||r.k==="analise"||r.k==="aprovada"||r.k==="livre")&&arq(r.n)!=="PX");
  if(S.pend==="na")rows=rows.filter(r=>r.k==="livre"&&naoAutorizado(r.n));
  if(S.pend==="blq")rows=rows.filter(r=>marked(r.k)&&bloqueio(r.n));
  if(S.pend==="an")rows=rows.filter(r=>r.k==="analise");
  if(S.pend==="desc")rows=descontadas().map(n=>{const k=status(n);return {n,k,a:amount(n,k)}});
  if(S.pend==="rec")rows=S.base.filter(n=>S.recompras[n.id]&&S.recompras[n.id].situacao!=="feita").map(n=>({n,k:"recompra",a:S.recompras[n.id].valor||0}));
  if(S.pend==="fat"&&S.fat){const set=fatInfo().all;rows=S.base.filter(n=>set.has(n.id)).map(n=>{const k=status(n);return {n,k,a:amount(n,k)}})}
  if(S.pend==="dy"&&S.pendY){const [y,k]=S.pendY.split("|");const isR=n=>S.recompras[n.id]&&S.recompras[n.id].situacao!=="feita";
    rows=S.base.filter(n=>{const m=mk(n.id);if(!m||(m.etapa!=="cedida"&&m.etapa!=="cobranca")||n.ven.slice(0,4)!==y)return false;
      if(k==="ced")return m.etapa==="cedida";if(k==="cob")return m.etapa==="cobranca";if(k==="cedA")return m.etapa==="cedida"&&!pago(n)&&!isR(n);if(k==="cobA")return m.etapa==="cobranca"&&!pago(n)&&!isR(n);
      if(k==="quit")return pago(n)&&!isR(n);if(k==="rec")return isR(n);if(k==="prorr"){const v=vencNovo(m);return v&&v.slice(0,4)!==y}return true}).map(n=>{const k2=status(n);return {n,k:k2,a:k==="ced"||k==="cob"||k==="quit"?(typeof mk(n.id).vcess==="number"?mk(n.id).vcess:n.valor):amount(n,k2)}})}
  if(S.pend==="fora"&&S.fat){const set=fatInfo().all;rows=scoped().filter(r=>!set.has(r.n.id))}
  if(S.pend==="ocultas")rows=(S.all||[]).filter(ocultar).map(n=>({n,k:status(n),a:n.valor}));
  if(S.pend==="quit")rows=S.base.filter(n=>S.baixas[n.id]).map(n=>({n,k:status(n),a:n.saldo0||0}));
  return rows;
}

  </div>

      <td>${pill(r.k)}${m&&m.etapa==="recusada"?` <span class="tag bad">recusada ${esc(m.fundo)}</span>`:""}</td>

      <td>${a==="PX"?`<span class="tag ok">PDF+XML</span>`:a==="P"?`<span class="tag">só PDF</span>`:a==="X"?`<span class="tag">só XML</span>`:`<span class="muted" style="font-size:12px">falta baixar</span>`}</td></tr>`;
  }
  h+=`</tbody></table></div>`;
  if(rows.length>S.limit)h+=`<div style="text-align:center;margin-top:12px"><button class="btn" id="more">Mostrar mais ${Math.min(300,rows.length-S.limit)} de ${rows.length-S.limit}</button></div>`;

  $("#fa").onchange=e=>{S.arqF=e.target.value;S.limit=300;render()};
  $("#fc").onchange=e=>{S.cesF=e.target.value;S.limit=300;render()};
  const bA=$("#bAlvo");if(bA)bA.onclick=()=>{
    const v=parseBR($("#alvo").value);if(!(v>0))return toast("Digite o valor do lote");
    const liv=notaRows().filter(r=>r.k==="livre"&&!naoAutorizado(r.n)).sort((a,b)=>a.n.ven<b.n.ven?-1:1);
    S.sel.clear();let acc=0;for(const r of liv){if(acc>=v)break;S.sel.add(r.n.id);acc+=r.a}

    if(e.target.closest("[data-clrpend]")){S.pend=null;render();return}
    const th=e.target.closest("th[data-sort]");if(th){const c=th.dataset.sort;S.sort=S.sort.k===c?{k:c,d:-S.sort.d}:{k:c,d:1};render();return}
    if(e.target.id==="more"){S.limit+=300;render();return}
    if(e.target.id==="selall"){const vis=rows.slice(0,S.limit);if(e.target.checked)vis.forEach(r=>S.sel.add(r.n.id));else vis.forEach(r=>S.sel.delete(r.n.id));render();return}
    const ck=e.target.closest("[data-ck]");if(ck){const id=ck.dataset.ck;ck.checked?S.sel.add(id):S.sel.delete(id);ck.closest("tr").classList.toggle("sel",ck.checked);renderBulk();return}
    const tr=e.target.closest("tr[data-id]");if(tr)openNota(tr.dataset.id);

  renderBulk();
}
function renderNotasKeepFocus(){const p=$("#q").selectionStart;renderNotas();const q=$("#q");q.focus();try{q.setSelectionRange(p,p)}catch(e){}}
function debounce(f,ms){let t;return()=>{clearTimeout(t);t=setTimeout(f,ms)}}
function parseBR(s){s=String(s||"").trim();if(!s)return NaN;if(/,/.test(s))s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");return parseFloat(s)}

/* ---------- ações em lote ---------- */
function renderBulk(){
  let el=$("#bulk");
  if(S.tab!=="notas"||!S.sel.size||!S.canWrite){if(el)el.remove();return}
  const sel=[...S.sel].map(id=>S.byId.get(id)).filter(Boolean);
  const tot=sel.reduce((s,n)=>s+amount(n,status(n)),0);
  if(!el){el=document.createElement("div");el.id="bulk";el.className="bulk";document.body.appendChild(el);
    el.innerHTML=`<div class="wrap"><b id="bk-n"></b>
      <select id="bk-et" aria-label="Situação">${ETAPAS.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select>
      <input type="text" id="bk-f" list="dl-fundos" placeholder="Fundo" style="width:150px" aria-label="Fundo">
      <input type="text" id="bk-c" placeholder="Nº da cessão" style="width:140px" aria-label="Número da cessão">
      <button class="btn pri" id="bk-ap">Marcar</button>
      <button class="btn" id="bk-clr">Limpar fundo</button>
      <button class="btn" id="bk-cp">Copiar lista</button>
      <button class="btn" id="bk-arq">Marcar PDF e XML baixados</button>
      <button class="btn" id="bk-x">Desmarcar</button></div>`;
    $("#bk-ap").onclick=async()=>{const f=$("#bk-f").value.trim(),et=$("#bk-et").value,c=$("#bk-c").value.trim();
      if(!f)return toast("Informe o fundo");await saveMarcas([...S.sel],{fundo:f,etapa:et,cessao:c});ensureFundo(f);S.sel.clear();render()};
    $("#bk-clr").onclick=async()=>{await clearMarcas([...S.sel]);S.sel.clear();render()};
    $("#bk-cp").onclick=()=>copyList([...S.sel]);
    $("#bk-arq").onclick=async()=>{const m={};[...S.sel].forEach(id=>{const n=S.byId.get(id);if(n)m[n.fil+"_"+parseInt(n.num,10)]="PX"});
      try{await S.db.doc("config/arquivos").update({m})}catch(e){try{await S.db.doc("config/arquivos").set({m:{...S.arquivos,...m}})}catch(e2){return toast(dbErr(e2))}}
      toast(`${Object.keys(m).length} notas marcadas com PDF e XML`);S.sel.clear();render()};
    $("#bk-x").onclick=()=>{S.sel.clear();render()};
  }
  $("#bk-n").textContent=`${S.sel.size} ${S.sel.size===1?"nota":"notas"} · ${money(tot)}`;
}
function copyList(ids){
  const L=["Filial\tNF\tParcela\tCliente\tCPF/CNPJ\tEmissão\tVencimento\tSaldo\tSituação\tFundo\tCessão"];
  ids.map(id=>S.byId.get(id)).filter(Boolean).sort((a,b)=>a.ven<b.ven?-1:1).forEach(n=>{const m=mk(n.id)||{};const k=status(n);
    L.push([n.fil,n.num,n.par,n.nome,fmtDoc(n.cpf),dBR(n.emi),dBR(n.ven),amount(n,k).toFixed(2).replace(".",","),ST[k].l,m.fundo||"",m.cessao||""].join("\t"))});
  const txt=L.join("\n");
  const fallback=()=>{const t=document.createElement("textarea");t.value=txt;t.style.cssText="position:fixed;inset:20% 10%;z-index:40;height:50%";document.body.appendChild(t);t.select();toast("Copie com Ctrl+C e cole no Excel. Clique fora para fechar.");t.onblur=()=>t.remove()};
  try{navigator.clipboard.writeText(txt).then(()=>toast(`${ids.length} notas copiadas, cole no Excel`),fallback)}catch(e){fallback()}
}

/* ---------- gravação ---------- */
async function pool(items,fn,c=4){let i=0,err=null;const w=async()=>{while(i<items.length){const it=items[i++];try{await fn(it)}catch(e){err=e}}};await Promise.all(Array.from({length:c},w));if(err)throw err}
function dbErr(e){const c=e&&e.code;if(c==="invalid_argument"){S.canWrite=false;render();return "Você só tem acesso de leitura nesta página."}
  if(c==="quota_exceeded")return "O banco do site está cheio. Apague bases antigas ou fale com quem administra.";return "Não deu para salvar agora. Tente de novo em instantes."}
function keepV(id,d){const o=mk(id);return o&&typeof o.vcess==="number"&&o.fundo===d.fundo&&(o.cessao||"")===(d.cessao||"")?{vcess:o.vcess}:{}}
async function saveMarcas(ids,data){
  const now=new Date().toISOString();
  try{await pool(ids,id=>S.db.collection("marcas").doc(id).set({...data,obs:(mk(id)||{}).obs||"",...keepV(id,data),por:S.uid||"",em:now}));toast(`${ids.length} ${ids.length===1?"nota marcada":"notas marcadas"}`)}
  catch(e){toast(dbErr(e))}
}
async function clearMarcas(ids){
  ids=ids.filter(id=>mk(id));if(!ids.length)return toast("Nenhuma das notas tinha fundo");
  const now=new Date().toISOString();
  try{await pool(ids,id=>S.db.collection("marcas").doc(id).set({fundo:"",etapa:"",cessao:"",obs:"",por:S.uid||"",em:now}));toast(`Fundo retirado de ${ids.length} notas`)}catch(e){toast(dbErr(e))}
}
async function ensureFundo(f){if(S.fundos.some(x=>x.toUpperCase()===f.toUpperCase()))return;
  try{await S.db.doc("config/fundos").set({lista:[...S.fundos,f]})}catch(e){}}

function toISO(v){
  if(v==null||v==="")return "";
  if(v instanceof Date){if(v.getFullYear()<=1900)return "";const d=new Date(v.getTime()+12*3600e3);return d.toISOString().slice(0,10)}
  if(typeof v==="number"){const d=XLSX.SSF.parse_date_code(v);if(!d||d.y<=1900)return "";return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`}
  const s=String(v).trim();let m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(m)return m[3]>"1900"?`${m[3]}-${m[2]}-${m[1]}`:"";
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]>"1900"?m[0]:"";return "";
}
function numBR(v){if(v==null||v==="")return 0;if(typeof v==="number")return v;const s=String(v).trim().replace(/\./g,"").replace(",",".");const x=parseFloat(s);return isNaN(x)?0:x}
function parseFundo(f,o){
  f=String(f||"").trim();o=String(o||"").trim();if(!f)return null;
  let fundo=f,etapa="aprovada";const m=f.match(/^(N[ÃA]O APROVADO|APROVADO|AN[AÁ]LISE)\s*\(?([^)]*)\)?$/i);
  if(m){fundo=m[2].trim();const k=m[1].toUpperCase();etapa=/AN/.test(k)&&!/APROV/.test(k)?"analise":/^N/.test(k)?"recusada":"aprovada"}
  let cessao="";const ou=o.toUpperCase();
  if(ou.includes("COBRAN"))etapa="cobranca";else if(ou.startsWith("CESS")){etapa="cedida";cessao=o.slice(6).trim()}
  const obs=(ou.startsWith("CESS")||ou.startsWith("AGUARDANDO"))?"":o;
  return {fundo,etapa,cessao,obs};
}

      for(let i=0;i<Math.min(10,aoa.length);i++){const H=(aoa[i]||[]).map(x=>String(x??"").trim().toUpperCase());

    S.imp={rows,fromFile,recs,recNew,file:file.name,consulta:!pref,fat:{total:fatTot,n:rows.length,vde:fatV[0]||"",vate:fatV[fatV.length-1]||"",ids:rows.map(x=>x[0])}};
    res.innerHTML=`<div class="panel" style="background:var(--sunk);border:0">
      <dl class="kv" style="margin-top:0"><dt>Aba lida</dt><dd>${esc(found.nm)}</dd><dt>Notas (NF) para guardar</dt><dd class="num">${rows.length.toLocaleString("pt-BR")}</dd>
      <dt>Novas desde a última base</dt><dd class="num">${novas}</dd><dt>Saíram da base</dt><dd class="num">${sairam} <span class="muted">(quitadas ou baixadas)</span></dd></dl>
      <div class="form"><label>Data da base<input type="date" id="imp-d" value="${guess}"></label>
      ${recNew.length?`<label class="row" style="gap:6px;color:var(--fg)"><input type="checkbox" id="imp-rc" checked> Registrar ${recNew.length} ${recNew.length===1?"recompra nova":"recompras novas"} (observação RECOMPRA na aba NOTAS DESCONTADAS)</label>`:(Object.keys(recs).length?`<span class="muted" style="font-size:12px">As ${Object.keys(recs).length} notas com observação RECOMPRA já estão nas recompras do site.</span>`:"")}
      ${nFF?`<label class="row" style="gap:6px;color:var(--fg)"><input type="checkbox" id="imp-ff" checked> Trazer também ${nFF} marcações de fundo que estão na planilha e ainda não estão no site</label>`:""}
      ${!pref?`<div class="panel" style="padding:12px;border-color:var(--st-analise)"><b>Esse arquivo parece uma consulta do Protheus</b> (não tem a aba BASE). Ele soma <span class="num">${money(fatTot)}</span> em ${rows.length} notas.<br>
        <span class="muted" style="font-size:13px">"Atualizar com a consulta" atualiza o Faturado e os saldos das notas, e inclui as notas novas, mantendo as notas da planilha que não vêm na consulta. "Substituir a base" troca todas as notas do site só pelas da consulta.</span>
        <div class="row" style="margin-top:8px"><button class="btn pri" id="imp-fat">Atualizar com a consulta</button></div></div>`:""}
      <div class="row"><button class="btn ${pref?"pri":""}" id="imp-go">${pref?"Atualizar base":"Substituir a base"}</button><span class="muted" id="imp-st" style="font-size:12px"></span></div></div></div>`;
    $("#imp-go").onclick=doImport;
    const bf=$("#imp-fat");if(bf)bf.onclick=async()=>{bf.disabled=true;try{const ex=S.fat&&S.fat.extra;let extra=null;if(ex&&ex.ids){const nw=new Set(S.imp.fat.ids);const keep=ex.ids.filter(i=>!nw.has(i));if(keep.length){const tt=keep.reduce((t,i)=>{const n=S.byId.get(i);return t+(n?n.valor:0)},0);extra={...ex,ids:keep,n:keep.length,total:Math.round(tt*100)/100}}}
      await S.db.doc("config/faturado").set({...S.imp.fat,...(extra?{extra}:{}),arquivo:file.name,em:new Date().toISOString(),por:S.uid||""});
      const map=new Map((S.all||S.base).map(n=>[n.id,[n.id,n.fil,n.pre,n.num,n.par,n.nat,n.cli,n.loja,n.cpf,n.nome,n.emi,n.ven0||n.ven,n.vr,n.valor,n.saldo0!==undefined?n.saldo0:n.saldo,n.st,n.obsP||""]]));
      S.imp.rows.forEach(r=>map.set(r[0],r));S.imp.rows=[...map.values()];S.imp.consulta=false;S.imp.fromFile={};await doImport()}catch(e){bf.disabled=false;toast(dbErr(e))}};
  }catch(e){console.error(e);res.innerHTML=`<p><span class="tag bad">Erro ao ler</span> Não consegui abrir esse arquivo. Confira se é um .xlsx válido.</p>`}
}
async function doImport(){
  const I=S.imp;if(!I)return;const btn=$("#imp-go"),st=$("#imp-st");btn.disabled=true;
  const imp="i"+Date.now();const cols=["id","fil","pre","num","par","nat","cli","loja","cpf","nome","emi","ven","vr","valor","saldo","st","obsP"];
  try{
    const ex=S.fat&&S.fat.extra;let extra=null;
    if(I.consulta&&ex&&ex.ids){const have=new Set(I.rows.map(x=>x[0]));const keep=ex.ids.filter(i=>!have.has(i)&&S.byId.get(i));
      keep.forEach(i=>{const n=S.byId.get(i);I.rows.push([n.id,n.fil,n.pre,n.num,n.par,n.nat,n.cli,n.loja,n.cpf,n.nome,n.emi,n.ven0||n.ven,n.vr,n.valor,n.saldo0!==undefined?n.saldo0:n.saldo,n.st,n.obsP||""])});
      if(keep.length)extra={...ex,ids:keep,n:keep.length,total:Math.round(keep.reduce((t,i)=>t+S.byId.get(i).valor,0)*100)/100}}
    const chunks=[];let cur=[],size=0;
    for(const r of I.rows){const l=JSON.stringify(r).length+1;if(size+l>180000&&cur.length){chunks.push(cur);cur=[];size=0}cur.push(r);size+=l}
    if(cur.length)chunks.push(cur);
    for(let i=0;i<chunks.length;i++){st.textContent=`Gravando parte ${i+1} de ${chunks.length}…`;await S.db.collection("chunks").doc(`${imp}-${i}`).set({importId:imp,i,cols,rows:chunks[i]})}
    await S.db.doc("config/meta").set({importId:imp,chunks:chunks.length,total:I.rows.length,dataBase:$("#imp-d").value||new Date().toISOString().slice(0,10),importadoEm:new Date().toISOString(),arquivo:I.file,por:S.uid||""});
    const ff=$("#imp-ff");
    if(ff&&ff.checked){const ids=Object.keys(I.fromFile);let k=0;const now=new Date().toISOString();
      await pool(ids,async id=>{await S.db.collection("marcas").doc(id).set({...I.fromFile[id],por:S.uid||"",em:now});st.textContent=`Marcações ${++k} de ${ids.length}…`})}
    const rc=$("#imp-rc");
    if(rc&&rc.checked){const now=new Date().toISOString();await pool(I.recNew,id=>S.db.collection("recompras").doc(id).set({...I.recs[id],por:S.uid||"",em:now}))}
    st.textContent="Limpando a base anterior…";
    try{const old=await S.db.collection("chunks").where("importId","!=",imp).get();await pool(old.docs.map(d=>d.id),id=>S.db.collection("chunks").doc(id).delete())}catch(e){}
    S.imp=null;toast("Base atualizada");go("painel");
  }catch(e){btn.disabled=false;st.textContent="";toast(dbErr(e))}
}

/* ---------- geral ---------- */
let toastT;function toast(t){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}
function datalists(){
  let el=$("#dls");if(!el){el=document.createElement("div");el.id="dls";el.hidden=true;document.body.appendChild(el)}
  const cl=[...new Set(S.base.map(n=>n.nome))].sort();
  el.innerHTML=`<datalist id="dl-fundos">${S.fundos.map(f=>`<option value="${esc(f)}">`).join("")}</datalist>
  <datalist id="dl-aut"><option value="Autorizado"><option value="Não autorizado"><option value="Negociação comercial"><option value="Barter"><option value="Rating baixo"></datalist>
  <datalist id="dl-doc"><option value="IRPF"><option value="IRPF + recibo"><option value="SEM IR"><option value="BALANÇO"><option value="SEM BALANÇO"><option value="BALANÇO / DRE"></datalist>
  <datalist id="dl-cli">${cl.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`;
}
let rq=0;function render(){cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{
  refilter();
  renderBaseChip();renderScope();
  if(!S.db&&S.loaded){$("#main").innerHTML=`<div class="panel empty"><h2>Sem acesso aos dados</h2><p>Entre com seu e-mail e senha para ver e editar as notas.</p></div>`;return}
  if(!S.loaded){return}
  ({painel:renderPainel,notas:renderNotas,clientes:renderClientes,bloqueios:renderBloqueios,importar:renderImportar})[S.tab]();
  if(S.tab!=="notas")renderBulk();
})}

async function loadChunks(meta){
  if(!meta){S.base=[];S.byId=new Map();S.loaded=true;render();return}
  for(let tries=0;tries<6;tries++){
    try{const snap=await S.db.collection("chunks").where("importId","==",meta.importId).get();
      const docs=snap.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i);
      if(docs.length>=meta.chunks){
        const base=[];for(const d of docs){const C=d.cols;for(const r of d.rows){const o={};C.forEach((c,j)=>o[c]=r[j]);base.push(o)}}
        if(S.metaId!==meta.importId)return;
        S.all=base;S.base=base;applyBaixas();S.byId=new Map(base.map(n=>[n.id,n]));refilter();S.loaded=true;datalists();render();return}
    }catch(e){}
    await new Promise(r=>setTimeout(r,1500*(tries+1)));
  }
  S.loaded=true;render();toast("A base ainda está sendo gravada. Recarregue em instantes.");
}

async function boot(){
  const h=(location.hash||"").slice(1);if(["painel","notas","clientes","bloqueios","importar"].includes(h))S.tab=h;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  renderBaseChip();
  const user=await window.AUTH_READY;
  const db=window.AppDB;
  S.db=db;S.user=user;S.uid=user?user.id:"";
  const onErr=e=>{if(e&&e.code==="revoked"){S.db=null;render()}};
  db.doc("config/meta").onSnapshot(s=>{const m=s.exists?s.data():null;const id=m?m.importId:null;S.meta=m;
    if(id!==S.metaId){S.metaId=id;loadChunks(m)}else render()},onErr);
  db.collection("marcas").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.marcas=o;render()},onErr);
  db.collection("bloqueios").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.bloq=o;render()},onErr);
  db.doc("config/clientes").onSnapshot(s=>{S.clientes=(s.exists&&s.data().m)||{};render()},onErr);
  db.doc("config/arquivos").onSnapshot(s=>{S.arquivos=(s.exists&&s.data().m)||{};render()},onErr);
  db.doc("config/marcas_iniciais").onSnapshot(s=>{S.seedM=(s.exists&&s.data().m)||{};render()},onErr);
  db.collection("recompras").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.recompras=o;render()},onErr);
  db.collection("baixas").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.baixas=o;applyBaixas();render()},onErr);
  db.doc("config/vencnovo").onSnapshot(s=>{S.vnovo=(s.exists&&s.data().m)||{};applyBaixas();render()},onErr);
  db.doc("config/faturado").onSnapshot(s=>{S.fat=s.exists?s.data():null;render()},onErr);
  db.doc("config/cessoes").onSnapshot(s=>{S.cessoes=(s.exists&&s.data().m)||{};render()},onErr);
  db.doc("config/fundos").onSnapshot(s=>{S.fundos=(s.exists&&s.data().lista)||[];datalists()},onErr);
}
boot();
})();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
<script>
/* rótulos das colunas para a versão celular (cada célula recebe o nome da coluna) */
(function(){
  function label(root){root.querySelectorAll(".tbl-wrap").forEach(w=>{const t=w.querySelector("table");if(!t)return;
    const ths=[...t.querySelectorAll("thead th")].map(th=>th.textContent.trim().replace(/[↑↓]/g,"").trim());if(!ths.length)return;
    w.classList.add("cards");
    t.querySelectorAll("tbody tr, tfoot tr").forEach(tr=>{let i=0;[...tr.children].forEach(td=>{const n=+(td.getAttribute("colspan")||1);if(!td.hasAttribute("data-label"))td.setAttribute("data-label",n>1?"":(ths[i]||""));i+=n})})})}
  let q;const run=()=>{cancelAnimationFrame(q);q=requestAnimationFrame(()=>label(document))};
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true});run();
})();
</script>
